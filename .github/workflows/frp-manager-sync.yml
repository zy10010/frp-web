name: frp-manager-sync

on:
  schedule:
    # Daily at 03:00 UTC. Adjust as needed.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: sync with upstream frp
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          # Use SYNC_TOKEN (a PAT) when available so that pushes made below also
          # trigger the frp-manager-release workflow. Falls back to GITHUB_TOKEN.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/fatedier/frp.git || true
          git fetch upstream '+refs/heads/dev:refs/remotes/upstream/dev'

      - name: Sync with upstream
        id: sync
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/dev)" ]; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base HEAD upstream/dev >/dev/null 2>&1; then
            # Related histories (a true fork): merge normally.
            git merge upstream/dev --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "force=" >> "$GITHUB_OUTPUT"
          else
            # Unrelated histories (a fresh repo, not a fork): rebuild dev from
            # upstream plus our additive files.
            echo "Rebuilding dev on top of upstream (unrelated histories)."
            OUR_PATHS="cmd/frp-manager hack/gen-desc hack/sync-assets.sh packaging \
              .github/workflows/frp-manager-ci.yml \
              .github/workflows/frp-manager-release.yml \
              .github/workflows/frp-manager-sync.yml"
            TMP="$(mktemp -d)"
            for p in $OUR_PATHS; do
              if [ -e "$p" ]; then
                mkdir -p "$TMP/$(dirname "$p")"
                cp -a "$p" "$TMP/$(dirname "$p")/"
              fi
            done
            git checkout -B dev upstream/dev
            for p in $OUR_PATHS; do
              if [ -e "$TMP/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp -a "$TMP/$p" "$(dirname "$p")/"
              fi
            done
            rm -rf "$TMP"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate assets
        if: steps.sync.outputs.changed == 'true'
        run: bash hack/sync-assets.sh

      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync with upstream frp"
          fi

      - name: Push dev
        if: steps.sync.outputs.changed == 'true'
        run: git push origin dev ${{ steps.sync.outputs.force }}

      - name: Verify build after sync
        if: steps.sync.outputs.changed == 'true'
        run: |
          go vet ./cmd/frp-manager/
          go build -o /tmp/frp-manager ./cmd/frp-manager
          go build -tags noweb -o /tmp/frps ./cmd/frps
          go build -tags noweb -o /tmp/frpc ./cmd/frpc

      - name: Check for new upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh api repos/fatedier/frp/releases/latest --jq .tag_name 2>/dev/null || true)"
          case "$LATEST" in
            v*) ;;
            *)
              echo "Could not determine latest upstream release (got: '$LATEST'); skipping auto-release."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          V="${LATEST#v}"
          OUR_TAG="frp-manager-v${V}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "tag=$OUR_TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "$OUR_TAG" | grep -q "$OUR_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $OUR_TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release $LATEST -> will publish $OUR_TAG."
          fi

      - name: Create and push release tag
        if: steps.release.outputs.exists == 'false'
        run: |
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
